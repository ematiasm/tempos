name: Unit Tests

on:
  pull_request:
    paths:
      - frontend/**
      - .github/workflows/unit-tests.yml

permissions: {}

jobs:
  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      # Frontend unit tests cover the pure logic — money and date formatting, payment
      # math, the price chain — which the Playwright suite cannot reach: it needs the whole
      # stack and asserts through the DOM, so a wrong expectation there fails minutes later
      # and in a different layer. These run in seconds and need no services.
      - run: bun ci
        working-directory: frontend
      - run: bun run test:unit
        working-directory: frontend
