name: Labels
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - opened
      - synchronize
      - reopened
      # For label-checker
      - labeled
      - unlabeled

permissions: {}

jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
      if: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' }}
    - run: echo "Done adding labels"
  # Run this after labeler applied labels
  check-labels:
    needs:
      - labeler
    permissions:
      issues: read # Read the pull request's labels, which is an issues endpoint.
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Replaces agilepathway/label-checker, whose pinned release builds its own Docker
      # image and now fails before it can read a label: its Dockerfile installs upx-ucl
      # from Debian bullseye, whose security repository is expired, so `apt-get update`
      # breaks the build on every pull request. This check needs no image and no
      # third-party action.
      - name: Require exactly one type label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ALLOWED: breaking,security,feature,bug,refactor,upgrade,docs,lang-all,internal
        run: |
          set -euo pipefail
          labels=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/labels" --jq '.[].name')
          matches=$(printf '%s\n' "$labels" | grep -E "^(${ALLOWED//,/|})$" || true)
          count=$(printf '%s' "$matches" | grep -c . || true)
          found=$(printf '%s' "$matches" | tr '\n' ' ')
          present=$(printf '%s' "$labels" | tr '\n' ' ')
          if [ "$count" -eq 0 ]; then
            echo "::error::This pull request needs one type label: $ALLOWED"
            echo "Labels found: ${present:-none}"
            exit 1
          fi
          if [ "$count" -gt 1 ]; then
            echo "::error::This pull request carries more than one type label ($found); keep the primary one"
            echo "Labels found: $present"
            exit 1
          fi
          echo "Label check passed: $found"
