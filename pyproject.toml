[dependency-groups]
dev = [
    "prek>=0.4.12,<1.0.0",
    "zizmor>=1.29.0",
]

github-actions = [
    "smokeshow >=0.5.0",
]

[tool.uv.workspace]
members = ["backend"]

[tool.typos.files]
extend-exclude = [
    "img/",
    "uv.lock",
    "bun.lock",
    "backend/coverage/",
    "backend/htmlcov/",
    "frontend/dist/",
    "frontend/public/assets/images/",
]

[tool.typos.default]
extend-ignore-re = [
    # GitHub usernames in @mentions
    "@[a-zA-Z0-9](?:-?[a-zA-Z0-9])*",
    # Name of the package in the PR title
    "Bump certifi ",
]

[tool.typos.default.extend-identifiers]
alls = "alls"

# mypy requires the blanket ``# type: ignore`` on the ``Settings()`` call in
# backend/app/core/config.py (pydantic-settings injects the required fields
# from .env at runtime); ty does not report those errors, so it would flag
# the directive as unused. The CI ty hook runs from the repository root, so
# this override must live in the root pyproject as well as backend/pyproject.
[tool.ty.rules]
"unused-type-ignore-comment" = "ignore"
