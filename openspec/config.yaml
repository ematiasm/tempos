# SDD configuration for tempos (hybrid mode: openspec files + Engram topic keys)
schema: spec-driven

context: |
  Tech stack: FastAPI + SQLModel + Pydantic v2 + Alembic + PostgreSQL (Python >=3.14); React 19 + Vite + TanStack Router/Query + shadcn/ui + Tailwind v4 (bun, TypeScript).
  Architecture: Monorepo (backend/ + frontend/) forked from fastapi full-stack template; Odoo-style unified documents; append-only ledgers; OpenAPI-autogenerated frontend client.
  Testing: pytest against real Postgres (docker compose stack required, non-parallel-safe); Playwright E2E; coverage via backend/scripts/test.sh.
  Style: All code and artifacts in English; ruff + mypy --strict + ty (backend), biome + tsc (frontend).

strict_tdd: true

testing:
  backend_test_command: "cd backend && bash scripts/test.sh"
  backend_targeted_test_command: "cd backend && uv run pytest tests/api/routes/test_<module>.py -x"
  backend_lint_command: "cd backend && bash scripts/lint.sh"
  frontend_typecheck_command: "cd frontend && bunx tsc -p tsconfig.build.json --noEmit"
  frontend_build_command: "cd frontend && bun run build"
  frontend_lint_command: "cd frontend && bun run lint"
  frontend_e2e_command: "cd frontend && bunx playwright test"
  client_regeneration_command: "bash ./scripts/generate-client.sh"
  prerequisites: "Backend tests need the docker compose db service up and migrations applied; tests are non-parallel-safe."

rules:
  proposal:
    - Include rollback plan for risky changes
    - Never invent business data; ask the user when domain-specific values are underspecified (AGENTS.md rule 1)
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Respect append-only ledgers, atomic saldo updates, and DocumentSequence locking (AGENTS.md rules 5-7, 15)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Include a client regeneration task after any backend OpenAPI-shape change
  apply:
    guidelines:
      - Follow existing code patterns (see AGENTS.md section 4 for where things live)
    tdd: true
    test_command: "cd backend && bash scripts/test.sh"
  verify:
    test_command: "cd backend && bash scripts/test.sh"
    build_command: "cd frontend && bun run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
